name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # Adjust to your version if needed
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: medofast_android/medofast_android

      - name: Build APK
        run: flutter build apk --release
        working-directory: medofast_android/medofast_android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: medofast_android/medofast_android/build/app/outputs/flutter-apk/app-release.apk
